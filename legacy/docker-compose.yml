services:
  db:
    image: mysql:latest
    container_name: feiying-db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql/clients.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=X5fG1hY7jK3lZ9mA2nS4pD6qF8rH0b
      - MYSQL_DATABASE=clients
      - MYSQL_USER=feiying
      - MYSQL_PASSWORD=X5fG1hY7jK3lZ9mA2nS4pD6qF8rH0b
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pX5fG1hY7jK3lZ9mA2nS4pD6qF8rH0b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - feiying-network
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: feiying-php
    volumes:
      - ./src:/var/www/html/src
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
      - ./docker/php/php-error.ini:/usr/local/etc/php/conf.d/error.ini
      - ./storage/logs:/var/log
      - ./build_apk.php:/var/www/html/build_apk.php
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=X5fG1hY7jK3lZ9mA2nS4pD6qF8rH0b
      - DB_NAME=clients
    networks:
      - feiying-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: feiying-nginx
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./storage:/var/www/html/storage
    depends_on:
      - php
    environment:
      - TZ=Asia/Shanghai
    networks:
      - feiying-network
    restart: unless-stopped

  websocket:
    image: node:alpine
    container_name: feiying-ws
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./src/api/ws:/app
      - ./src/private/apkstub:/apkstub:ro
    command: sh -c "npm install 2>/dev/null || true && node websocket-server.js"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    networks:
      - feiying-network
    restart: unless-stopped

networks:
  feiying-network:
    driver: bridge

volumes:
  mysql_data:
