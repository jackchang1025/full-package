<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # API 路由
    Alias /api /var/www/html/api/api
    <Directory /var/www/html/api/api>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 管理后台
    Alias /private /var/www/html/private/private
    <Directory /var/www/html/private/private>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 禁止访问敏感文件
    <FilesMatch "\.(sql|ini|log)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
