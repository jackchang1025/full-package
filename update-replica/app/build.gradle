plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.storm.safe.rock'
    compileSdk 34

    defaultConfig {
        applicationId "dev.deltalab2964.swift"
        minSdk 24
        targetSdk 34
        versionCode 40604
        versionName "4.6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // 调试配置由 assets/debug_config.json 控制
        }
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    // Network
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'io.socket:socket.io-client:2.1.0'

    // Crypto
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // JSON
    implementation 'com.squareup.moshi:moshi:1.15.0'

    // UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    // Compat
    implementation 'net.sourceforge.streamsupport:streamsupport:1.7.4'

    // Test (exclude conscrypt from test classpath — native JNI not available in JVM)
    testImplementation('junit:junit:4.13.2')
    configurations.testImplementation {
        exclude group: 'org.conscrypt', module: 'conscrypt-android'
    }
    configurations.testRuntimeOnly {
        exclude group: 'org.conscrypt', module: 'conscrypt-android'
    }
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    testImplementation 'androidx.work:work-testing:2.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
