server {
    listen 80;
    server_name localhost;
    
    # Frontend root - static files
    root /var/www/html/public;
    index index.html index.php;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Frontend SPA - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets (JS, CSS, images)
    location /assets {
        alias /var/www/html/public/assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
     # API endpoints - PHP
     location /api {
         alias /var/www/html/src/api;
         
         location ~ \.php$ {
             fastcgi_pass php:9000;
             fastcgi_index index.php;
             fastcgi_param SCRIPT_FILENAME $request_filename;
             fastcgi_read_timeout 300;
             fastcgi_send_timeout 300;
             fastcgi_connect_timeout 60;
             include fastcgi_params;
         }
     }
    
     # Private/Admin endpoints - PHP
     location /private {
         alias /var/www/html/src/private;
         
         location ~ \.php$ {
             fastcgi_pass php:9000;
             fastcgi_index index.php;
             fastcgi_param SCRIPT_FILENAME $request_filename;
             fastcgi_read_timeout 300;
             fastcgi_send_timeout 300;
             fastcgi_connect_timeout 60;
             include fastcgi_params;
         }
     }
    
    # User uploads (APKs, images, etc.)
    location /user {
        alias /var/www/html/storage/user;
        autoindex on;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ \.(sql|ini|log|env)$ {
        deny all;
    }
    
     # PHP files in root (if any)
     location ~ \.php$ {
         fastcgi_pass php:9000;
         fastcgi_index index.php;
         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
         fastcgi_read_timeout 300;
         fastcgi_send_timeout 300;
         fastcgi_connect_timeout 60;
         include fastcgi_params;
     }
    
    # Logs
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
