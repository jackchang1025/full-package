# Nginx WebSocket Proxy Configuration
# Routes /api/ws/ requests to Swoole WebSocket server on port 8082

server {
    listen 8081;
    server_name _;

    # Access log to stdout for Docker
    access_log /dev/stdout;
    error_log /dev/stderr;

    # WebSocket proxy for /api/ws/ path
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-lived WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # Root path also proxies to WebSocket server for backward compatibility
    # Allows direct connections without /api/ws/ prefix
    location / {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-lived WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
