[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/var/www/html/storage/logs/php-stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/php-stderr.log
stderr_logfile_maxbytes=10MB
autostart=true
autorestart=true
startsecs=5
startretries=3

[program:websocket]
command=/usr/bin/php /var/www/html/artisan websocket:serve
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/var/www/html/storage/logs/websocket-stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/websocket-stderr.log
stderr_logfile_maxbytes=10MB
autostart=true
autorestart=true
startsecs=5
startretries=3

[program:queue]
command=/usr/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/var/www/html/storage/logs/queue-stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/queue-stderr.log
stderr_logfile_maxbytes=10MB
autostart=true
autorestart=true
startsecs=5
startretries=3
numprocs=2
process_name=%(program_name)s_%(process_num)02d

[program:scheduler]
command=/bin/bash -c "while [ true ]; do /usr/bin/php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/var/www/html/storage/logs/scheduler-stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/scheduler-stderr.log
stderr_logfile_maxbytes=10MB
autostart=true
autorestart=true
