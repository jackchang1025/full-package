# frps 服务端配置
# 由 Docker Compose 挂载到容器内
# 注意: INI 文件不支持环境变量替换，修改 token 需直接编辑此文件

[common]
bind_port = 7000
token = dev-frpc-token-2026

# Dashboard 管理面板
# 开发环境: http://localhost:7500
# 生产环境: 建议通过防火墙限制访问
dashboard_port = 7500
dashboard_user = admin
dashboard_pwd = admin123

# 日志
log_level = info
log_max_days = 7

# 允许设备使用的 remote_port 范围
# 必须与 Laravel .env 的 FRPC_PORT_RANGE_START/END 一致
allow_ports = 20000-30000

# 连接管理
max_pool_count = 50
heartbeat_timeout = 90
