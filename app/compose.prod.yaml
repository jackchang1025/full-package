# 生产环境 Docker Compose 配置
# 用法: docker compose -f compose.prod.yaml up -d

services:
    app:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '1000'
        image: 'feiying-app:latest'
        container_name: feiying-app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'              # Web 应用
            - '${WEBSOCKET_PORT:-8081}:8081'    # WebSocket 直接对外
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            APP_ENV: production
            APP_DEBUG: 'false'
        volumes:
            - '.:/var/www/html'
            - './docker/supervisord.prod.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - feiying-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        container_name: feiying-mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro'
        networks:
            - feiying-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    redis:
        image: 'redis:alpine'
        container_name: feiying-redis
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - feiying-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        command: redis-server --appendonly yes

networks:
    feiying-network:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
