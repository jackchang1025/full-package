# 生产环境 Docker Compose 配置
# 用法: docker compose -f compose.prod.yaml up -d

services:
    app:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '1000'
        image: '${APP_IMAGE:-feiying-app:latest}'
        container_name: feiying-app
        restart: unless-stopped
        # 防止 restart 时无限等待：Swoole/Queue/Scheduler 可能无法快速响应 SIGTERM
        stop_grace_period: 25s
        ports:
            - '${APP_PORT:-80}:80'              # Web 应用
            - '${WEBSOCKET_PORT:-8081}:8081'    # WebSocket 直接对外
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - '../android:/var/www/android:ro'
            - './docker/supervisord.prod.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - feiying-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        container_name: feiying-mysql
        restart: unless-stopped
        # 生产环境默认不对外暴露数据库端口（更安全）
        # 如需从宿主机访问数据库（运维），取消注释下面的 ports
        # ports:
        #     - '${DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro'
        networks:
            - feiying-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    redis:
        image: 'redis:alpine'
        container_name: feiying-redis
        restart: unless-stopped
        # 生产环境默认不对外暴露 Redis 端口（更安全）
        # 如需从宿主机访问 Redis（运维），取消注释下面的 ports
        # ports:
        #     - '${REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - feiying-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        command: redis-server --appendonly yes

    frps:
        image: 'snowdreamtech/frps:0.51.3'
        container_name: feiying-frps
        restart: unless-stopped
        ports:
            - '${FRPS_BIND_PORT:-7000}:7000'        # frp 协议端口
            - '${FRPS_DASHBOARD_PORT:-7500}:7500'    # Dashboard 管理面板
            - '127.0.0.1:20000-30000:20000-30000'    # 设备隧道端口，仅绑定本地回环地址。Laravel 通过 docker service 名称访问 frps
        volumes:
            - './docker/frps/frps.ini:/etc/frp/frps.ini:ro'
        networks:
            - feiying-network
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "7000"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

networks:
    feiying-network:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
