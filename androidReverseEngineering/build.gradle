plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // Gson 不用 Maven 依赖 — vendor 使用混淆包名 com.google.json (非标准 com.google.gson)
    // 已作为源码包含在 src/com/google/json/

    compileOnly 'org.bouncycastle:bcprov-jdk15on:1.70'
    compileOnly 'org.bouncycastle:bcpkix-jdk15on:1.70'
    compileOnly 'org.bouncycastle:bctls-jdk15on:1.70'

    // Conscrypt SSL provider
    compileOnly 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'

    // Android support annotations (JAR, not AAR)
    compileOnly 'com.android.support:support-annotations:28.0.0'

    // Android SDK
    compileOnly files(androidJar())

    // Local stubs for Android libraries that are AAR-only
    compileOnly files('libs/stubs.jar')
}

def androidJar() {
    def sdkDir = System.env.ANDROID_HOME ?: System.env.ANDROID_SDK_ROOT ?: '/opt/android-sdk'
    for (ver in ['android-34', 'android-35', 'android-33']) {
        def jar = "$sdkDir/platforms/$ver/android.jar"
        if (new File(jar).exists()) return jar
    }
    return 'libs/android-stubs.jar'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:none', '-proc:none', '-Xmaxerrs', '5000']
    options.encoding = 'UTF-8'
}
